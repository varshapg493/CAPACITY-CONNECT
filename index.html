  <style>
    body {
      background-color: #080c14;
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(6, 182, 212, 0.08) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(59, 130, 246, 0.05) 0px, transparent 50%);
      background-attachment: fixed;
    }

    .cyber-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }

    .glass-panel {
      background: rgba(17, 24, 39, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .glass-panel-glow {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 255, 157, 0.3);
      box-shadow: 0 0 30px rgba(0, 255, 157, 0.15);
    }

    .glass-panel-glow-red {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(239, 68, 68, 0.3);
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.15);
    }

    .text-gradient-green {
      background: linear-gradient(135deg, #00FF9D 0%, #10B981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .text-gradient-nvidia {
      background: linear-gradient(135deg, #76B900 0%, #00FF9D 50%, #00F0FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes scan {
      0% { top: 0%; }
      50% { top: 100%; }
      100% { top: 0%; }
    }

    .animate-scan {
      position: absolute;
      animation: scan 2.5s linear infinite;
    }

    @keyframes flyToCompost {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
      50% { transform: translate(-120px, -40px) scale(0.8) rotate(-180deg); opacity: 0.8; }
      100% { transform: translate(-200px, 80px) scale(0.2) rotate(-360deg); opacity: 0; }
    }

    @keyframes flyToReject {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
      50% { transform: translate(120px, -40px) scale(0.8) rotate(180deg); opacity: 0.8; }
      100% { transform: translate(200px, 80px) scale(0.2) rotate(360deg); opacity: 0; }
    }

    .animate-fly-compost {
      animation: flyToCompost 1.4s ease-in-out forwards;
    }

    .animate-fly-reject {
      animation: flyToReject 1.4s ease-in-out forwards;
    }
  </style>
</head>

    // --- AI DETECTION PAGE ---
    function AIDetectionPage() {
      const [selectedItem, setSelectedItem] = useState(PRESET_ITEMS[0]);
      const [isScanning, setIsScanning] = useState(false);
      const [isSorting, setIsSorting] = useState(false);
      const [customImage, setCustomImage] = useState(null);
      const [webcamActive, setWebcamActive] = useState(false);
      
      const fileRef = useRef(null);

      const triggerScan = (item) => {
        setSelectedItem(item);
        setCustomImage(null);
        setWebcamActive(false);
        setIsScanning(true);
        setIsSorting(false);
        setTimeout(() => setIsScanning(false), 1400);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const url = URL.createObjectURL(file);
          setCustomImage(url);
          setWebcamActive(false);
          const isOrg = Math.random() > 0.4;
          const custom = {
            id: 'uploaded-item',
            name: file.name.split('.')[0] || 'Uploaded Waste Item',
            icon: isOrg ? '🥬' : '📦',
            image: url,
            category: 'Scanned Material',
            decision: isOrg ? 'Compost' : 'Reject',
            confidence: Number((96 + Math.random()*3.5).toFixed(1)),
            reason: isOrg ? 'Organic biodegradable waste.' : 'Non-biodegradable waste material.',
            disposal: isOrg ? 'Smart Compost Chamber.' : 'Recycling Bin.'
          };
          setSelectedItem(custom);
          setIsScanning(true);
          setIsSorting(false);
          setTimeout(() => setIsScanning(false), 1400);
        }
      };

      const triggerSort = () => {
        setIsSorting(true);
        if (selectedItem.decision === 'Compost' && window.confetti) {
          confetti({ particleCount: 40, spread: 60, origin: { y: 0.8 }, colors: ['#00FF9D', '#10B981'] });
        }
      };

      const activeImg = customImage || selectedItem.image;

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
          
          <div className="text-center space-y-2">
            <h1 className="text-3xl font-extrabold text-white">Realistic AI Waste Detection Engine</h1>
            <p className="text-gray-400 text-sm">Upload an image, simulate webcam capture, or select sample preset items.</p>
          </div>

          {/* Presets Bar */}
          <div className="glass-panel p-4 rounded-2xl border border-eco-border">
            <span className="text-xs font-mono text-eco-green-bright block mb-2 font-bold uppercase">PRESET SAMPLES:</span>
            <div className="flex flex-wrap gap-2">
              {PRESET_ITEMS.map(item => (
                <button
                  key={item.id}
                  onClick={() => triggerScan(item)}
                  className={`px-3 py-2 rounded-xl text-xs font-mono flex items-center gap-2 transition-all ${
                    selectedItem.id === item.id && !customImage
                      ? 'bg-eco-green text-gray-950 font-bold shadow-glow-green'
                      : 'bg-gray-900 text-gray-300 hover:text-white'
                  }`}
                >
                  <span className="text-base">{item.icon}</span>
                  <span>{item.name}</span>
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
            
            {/* Viewport & Controls */}
            <div className="glass-panel p-6 rounded-3xl border border-eco-border space-y-4">
              <div className="flex justify-between items-center text-xs font-mono text-gray-400">
                <span className="font-bold uppercase">Optical Input Viewport</span>
                <div className="flex gap-2">
                  <input type="file" ref={fileRef} onChange={handleFileUpload} accept="image/*" className="hidden" />
                  <button onClick={() => fileRef.current?.click()} className="px-2.5 py-1 rounded-lg bg-eco-card border border-eco-border text-eco-cyan hover:text-white font-mono text-[11px]">
                    Upload Image
                  </button>
                  <button onClick={() => { setWebcamActive(!webcamActive); triggerScan(selectedItem); }} className="px-2.5 py-1 rounded-lg bg-eco-card border border-eco-border text-eco-green-bright hover:text-white font-mono text-[11px]">
                    Webcam Capture
                  </button>
                </div>
              </div>

              <div className="relative aspect-video bg-gray-950 rounded-2xl overflow-hidden border border-eco-border flex items-center justify-center">
                
                {webcamActive ? (
                  <div className="w-full h-full flex flex-col items-center justify-center bg-gray-900 text-center p-4">
                    <span className="text-4xl mb-2 animate-bounce">📷</span>
                    <span className="font-mono text-xs text-eco-cyan font-bold">WEBCAM OPTICAL FEED ACTIVE</span>
                    <span className="text-[10px] text-gray-400 mt-1">Live Sensor Frame Capture Ready</span>
                  </div>
                ) : (
                  <img src={activeImg} alt={selectedItem.name} className="w-full h-full object-cover" />
                )}

                {/* Flying waste icon animation */}
                {isSorting && (
                  <div className={`absolute z-40 text-5xl ${selectedItem.decision === 'Compost' ? 'animate-fly-compost' : 'animate-fly-reject'}`}>
                    {selectedItem.icon}
                  </div>
                )}
                
                {isScanning && (
                  <div className="absolute inset-0 bg-eco-bg/60 backdrop-blur-xs flex flex-col items-center justify-center p-4 border-2 border-eco-cyan">
                    <div className="animate-scan inset-x-0 h-1 bg-eco-cyan-bright shadow-glow-cyan"></div>
                    <span className="font-mono text-xs text-eco-cyan-bright font-bold animate-pulse">NEURAL INFERENCE SCANNING...</span>
                  </div>
                )}

                {!isScanning && (
                  <div className="absolute top-4 left-4 bg-eco-card/90 backdrop-blur-md px-3 py-1.5 rounded-xl border border-eco-green/40 font-mono text-xs shadow-lg flex items-center gap-2">
                    <span className="text-xl">{selectedItem.icon}</span>
                    <div>
                      <span className="font-bold text-white block">{selectedItem.name}</span>
                      <span className="text-eco-green-bright text-[10px]">{selectedItem.confidence}% Confidence</span>
                    </div>
                  </div>
                )}
              </div>

              <button 
                onClick={() => triggerScan(selectedItem)}
                className="w-full py-3 rounded-xl bg-gradient-to-r from-eco-green to-eco-cyan text-gray-950 font-bold text-sm shadow-glow-green"
              >
                Re-Scan Waste Item
              </button>
            </div>

            {/* Detailed AI Report */}
            <div className="glass-panel p-6 rounded-3xl border border-eco-border space-y-5">
              <h3 className="font-mono text-xs text-eco-green-bright font-bold uppercase tracking-wider">AI Classification Report</h3>

              <div className="flex items-center gap-4 p-4 rounded-2xl bg-gray-950 border border-eco-border">
                <span className="text-4xl">{selectedItem.icon}</span>
