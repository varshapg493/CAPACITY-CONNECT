<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillUp - Skill & Employment Platform</title>

    <link rel="stylesheet" href="styles.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

<!-- =====================================================
     LOGIN PAGE
===================================================== -->

<div id="loginPage" class="login-page">

    <div class="login-left">

        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <div>
                <h2>SkillUp</h2>
                <span>Skill & Employment Platform</span>
            </div>
        </div>

        <div class="login-content">

            <h1>Welcome back! 👋</h1>

            <p>
                Learn new skills, track your progress,
                identify skill gaps and prepare for your career.
            </p>

            <div class="login-illustration">

                <div class="floating-card card-one">
                    <i class="fa-solid fa-chart-line"></i>
                </div>

                <div class="floating-card card-two">
                    <i class="fa-solid fa-award"></i>
                </div>

                <div class="student-image">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>

                <div class="floating-card card-three">
                    <i class="fa-solid fa-laptop-code"></i>
                </div>

            </div>

        </div>

    </div>


    <div class="login-right">

        <div class="login-box">

            <h2>Login</h2>

            <p class="login-subtitle">
                Enter your details to continue
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label>Name</label>

                    <input
                        type="text"
                        id="loginName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <i
                            class="fa-solid fa-eye"
                            id="togglePassword"
                        ></i>

                    </div>

                </div>


                <div class="role-selection">

                    <button
                        type="button"
                        class="role-btn active"
                        data-role="learner"
                    >
                        <i class="fa-solid fa-user-graduate"></i>
                        Learner
                    </button>

                    <button
                        type="button"
                        class="role-btn"
                        data-role="admin"
                    >
                        <i class="fa-solid fa-user-shield"></i>
                        Admin
                    </button>

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <p class="demo-login">

                <strong>Demo Admin:</strong><br>

                admin@skillup.com /
                admin123

            </p>

        </div>

    </div>

</div>


<!-- =====================================================
     MAIN APPLICATION
===================================================== -->

<div id="app" class="app hidden">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-brand">

            <div class="brand-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <div>
                <h2>SkillUp</h2>
                <span>Skill Platform</span>
            </div>

        </div>


        <!-- LEARNER NAVIGATION -->

        <nav id="learnerNav" class="navigation">

            <button class="nav-item active" data-page="dashboard">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </button>

            <button class="nav-item" data-page="courses">
                <i class="fa-solid fa-book"></i>
                <span>My Courses</span>
            </button>

            <button class="nav-item" data-page="skill-tracker">
                <i class="fa-solid fa-chart-simple"></i>
                <span>Skill Tracker</span>
            </button>

            <button class="nav-item" data-page="skill-gap">
                <i class="fa-solid fa-magnifying-glass-chart"></i>
                <span>Skill Gap</span>
            </button>

            <button class="nav-item" data-page="recommendations">
                <i class="fa-solid fa-lightbulb"></i>
                <span>Recommendations</span>
            </button>

            <button class="nav-item" data-page="badges">
                <i class="fa-solid fa-award"></i>
                <span>Badges</span>
            </button>

            <button class="nav-item" data-page="certificates">
                <i class="fa-solid fa-certificate"></i>
                <span>Certificates</span>
            </button>

            <button class="nav-item" data-page="discussions">
                <i class="fa-solid fa-comments"></i>
                <span>Discussion</span>
            </button>

            <button class="nav-item" data-page="notifications">
                <i class="fa-solid fa-bell"></i>
                <span>Notifications</span>
                <span class="notification-count" id="notificationCount">0</span>
            </button>

        </nav>


        <!-- ADMIN NAVIGATION -->

        <nav id="adminNav" class="navigation hidden">

            <button class="nav-item active" data-page="admin-dashboard">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Dashboard</span>
            </button>

            <button class="nav-item" data-page="admin-learners">
                <i class="fa-solid fa-users"></i>
                <span>Learners</span>
            </button>

            <button class="nav-item" data-page="admin-courses">
                <i class="fa-solid fa-book-open"></i>
                <span>Courses</span>
            </button>

            <button class="nav-item" data-page="admin-analytics">
                <i class="fa-solid fa-chart-line"></i>
                <span>Analytics</span>
            </button>

            <button class="nav-item" data-page="admin-discussions">
                <i class="fa-solid fa-comments"></i>
                <span>Discussions</span>
            </button>

            <button class="nav-item" data-page="admin-notifications">
                <i class="fa-solid fa-bell"></i>
                <span>Notifications</span>
            </button>

            <button class="nav-item" data-page="admin-settings">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </button>

        </nav>


        <div class="sidebar-bottom">

            <button
                class="nav-item"
                id="profileBtn"
            >
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </button>

            <button
                class="nav-item logout-btn"
                id="logoutBtn"
            >
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </button>

        </div>

    </aside>


    <!-- MAIN AREA -->

    <main class="main-content">

        <header class="topbar">

            <div>

                <button
                    id="mobileMenuBtn"
                    class="mobile-menu"
                >
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div>
                    <h3 id="pageTitle">Dashboard</h3>

                    <p id="pageSubtitle">
                        Track your learning journey
                    </p>
                </div>

            </div>


            <div class="topbar-right">

                <button
                    class="icon-button"
                    id="topNotificationBtn"
                >
                    <i class="fa-solid fa-bell"></i>
                    <span class="bell-dot"></span>
                </button>


                <button
                    class="user-menu"
                    id="topProfileBtn"
                >

                    <div class="avatar" id="topAvatar">
                        G
                    </div>

                    <div class="user-details">

                        <strong id="topUserName">
                            Learner
                        </strong>

                        <span id="topUserRole">
                            Learner
                        </span>

                    </div>

                    <i class="fa-solid fa-chevron-down"></i>

                </button>

            </div>

        </header>


        <!-- PAGE CONTENT -->

        <section
            id="pageContent"
            class="page-content"
        ></section>

    </main>

</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div
    id="modalOverlay"
    class="modal-overlay hidden"
>

    <div
        id="modalContent"
        class="modal-content"
    ></div>

</div>


<!-- TOAST -->

<div
    id="toast"
    class="toast"
></div>


<script src="script.js"></script>

</body>
</html>
